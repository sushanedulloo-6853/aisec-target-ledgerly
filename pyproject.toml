[project]
name = "ledgerly"
version = "0.4.0"
description = "Ledgerly - AI bookkeeping for small businesses"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.0",
    "gunicorn",
    "openai",
    "llama-index-core",
    "llama-index-llms-openai-like",
    "llama-index-embeddings-openai",
    "requests",
    "pypdf",
    "jinja2",
    "markdown",
    "matplotlib",
    "fpdf2",
    "python-dotenv",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ledgerly"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
